services:
  app:
    build: .
    env_file: .env
    environment:
      # SQLite lives on a mounted volume so it survives container rebuilds.
      DATABASE_URL: file:/app/data/app.db
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # SQLite lives on a mounted volume so it survives container rebuilds.
      - ./data:/app/data
      # Event logos/gallery images are written here at runtime.
      - ./uploads:/app/public/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Hourly SQLite backup sidecar. Takes a consistent sqlite3 .backup snapshot
  # of the live database (shared via the ./data bind mount) into ./backups and
  # prunes backups older than 7 days. See scripts/backup.sh and DEPLOY.md §9.
  backup:
    image: alpine:3.21
    command:
      - sh
      - -c
      - "apk add --no-cache sqlite3 >/dev/null && while true; do /scripts/backup.sh; sleep 3600; done"
    environment:
      DB_PATH: /app/data/app.db
      BACKUP_DIR: /backups
    volumes:
      # Read-only view of the live DB; sqlite3 .backup snapshots it safely.
      - ./data:/app/data:ro
      - ./backups:/backups
      - ./scripts:/scripts:ro
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}
